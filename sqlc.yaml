version: "2"
sql:
  - schema: "db/migrations"      # sqlc membaca skema langsung dari file migrasi!
    queries: "db/queries"        # Tempat kueri SQL Anda
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        sql_package: "pgx/v5"    # Pakai pgx v5
        emit_json_tags: true     # Otomatis tambah tag `json:"..."` pada struct
        emit_interface: true     # Buat file querier.go untuk kemudahan mock unit test